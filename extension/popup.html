<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>🎤 Snaz Karaoke</h1>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <label class="row">
    <span>ตัดเสียงร้อง <output id="strengthOut"></output></span>
    <input type="range" id="strength" min="0" max="1" step="0.05">
  </label>

  <label class="row">
    <span>เพิ่มความดังดนตรี <output id="boostDbOut"></output></span>
    <input type="range" id="boostDb" min="0" max="12" step="1">
  </label>

  <label class="row">
    <span>ช่วงที่ถือว่าเป็นเสียงร้อง <output id="widthOut"></output></span>
    <input type="range" id="width" min="0.05" max="1" step="0.05">
    <small>แคบ = ดนตรีเหลือมากขึ้น · กว้าง = ตัดเสียงร้องได้สะอาดขึ้น</small>
  </label>

  <label class="row">
    <span>เก็บเบสต่ำกว่า <output id="lowHzOut"></output></span>
    <input type="range" id="lowHz" min="40" max="400" step="10">
  </label>

  <label class="row">
    <span>เก็บเสียงแหลมสูงกว่า <output id="highHzOut"></output></span>
    <input type="range" id="highHz" min="3000" max="16000" step="250">
  </label>

  <button id="reset">ค่าเริ่มต้น</button>
  <p id="status" class="status"></p>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
