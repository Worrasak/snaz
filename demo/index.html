<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snaz Karaoke Demo</title>
  <style>
    :root { --bg: #fff; --fg: #1a1a1a; --accent: #e62117; }
    @media (prefers-color-scheme: dark) { :root { --bg: #202124; --fg: #e8eaed; } }
    body { max-width: 560px; margin: 32px auto; padding: 0 16px; font: 16px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    audio, input[type=range] { width: 100%; accent-color: var(--accent); }
    label { display: block; margin: 16px 0; }
  </style>
</head>
<body>
  <h1>🎤 Snaz Karaoke — ทดสอบกับไฟล์เพลง</h1>
  <p>เลือกไฟล์เพลง (สเตอริโอ) แล้วเปิด/ปิดการตัดเสียงร้องเพื่อเปรียบเทียบ</p>
  <input type="file" id="file" accept="audio/*">
  <audio id="player" controls></audio>
  <label><input type="checkbox" id="enabled" checked> ตัดเสียงร้อง</label>
  <label>ความแรง <input type="range" id="strength" min="0" max="1" step="0.05" value="1"></label>

  <script>
    const player = document.getElementById('player');
    let node = null;

    async function setup() {
      if (node) return;
      const ctx = new AudioContext();
      await ctx.audioWorklet.addModule('../extension/vocal-remover-worklet.js');
      node = new AudioWorkletNode(ctx, 'vocal-remover', {
        outputChannelCount: [2], channelCount: 2, channelCountMode: 'explicit',
        processorOptions: params(),
      });
      ctx.createMediaElementSource(player).connect(node).connect(ctx.destination);
    }

    function params() {
      return {
        enabled: document.getElementById('enabled').checked,
        strength: Number(document.getElementById('strength').value),
      };
    }

    document.getElementById('file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await setup();
      player.src = URL.createObjectURL(file);
      player.play();
    });
    for (const id of ['enabled', 'strength']) {
      document.getElementById(id).addEventListener('input', () => node && node.port.postMessage(params()));
    }
  </script>
</body>
</html>
